name: release

# Builds every agent package + the Android APK and publishes them to a
# GitHub Release. Run it from Actions → release → "Run workflow".
#
# APK signing: add repository secrets so every release is signed with the
# SAME key (Android refuses upgrades signed with a different key):
#   ANDROID_KEYSTORE_BASE64   base64 of mobile/android-control/keystore/release.jks
#   ANDROID_KEYSTORE_PASSWORD store/key password (see keystore/keystore.properties)
# Without them the APK job is skipped.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build packages
        run: bash scripts/build-release.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agents
          path: dist/release/

  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: restore signing key
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p mobile/android-control/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android-control/keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=agentmesh\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            > mobile/android-control/keystore/keystore.properties
      - name: build APK
        if: env.HAS_KEY == 'true'
        run: |
          docker build -f infrastructure/docker/android-build.Dockerfile -t agentmesh/android-build infrastructure/docker
          docker run --rm -v "$PWD:/src" -e AGENTMESH_VERSION_NAME="${{ inputs.version }}" \
            -e AGENTMESH_VERSION_CODE="${{ github.run_number }}" agentmesh/android-build sh mobile/android-control/build.sh
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: apk
          path: dist/agentmesh-control.apk

  publish:
    runs-on: ubuntu-latest
    needs: [agents, apk]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: checksums
        run: cd out && sha256sum -- * | grep -v SHA256SUMS > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: AgentMesh ${{ inputs.version }}
          files: out/*
          overwrite_files: true
