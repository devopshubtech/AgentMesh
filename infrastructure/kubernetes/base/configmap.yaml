apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-config
data:
  AGENTMESH_ENV: production
  AGENTMESH_LOG_LEVEL: info
  AGENTMESH_NATS_URL: nats://nats.nats.svc.cluster.local:4222
  AGENTMESH_PUBLIC_GATEWAY_URL: https://agents.mesh.example.com
  AGENTMESH_TRUST_PROXY_HEADERS: "true"
  AGENTMESH_COOKIE_SECURE: "true"
  AGENTMESH_HEARTBEAT_INTERVAL: 30s
  AGENTMESH_GATEWAY_MAX_CONNECTIONS: "20000"
---
# Example only — create the real secret from your secret manager.
# Keys: AGENTMESH_DATABASE_URL, AGENTMESH_USER_TOKEN_KEY, AGENTMESH_DEVICE_TOKEN_KEY,
#       AGENTMESH_COMMAND_SIGNING_KEY (control-api only), AGENTMESH_COMMAND_PUBLIC_KEY
# Generate keys with:  amctl keygen
