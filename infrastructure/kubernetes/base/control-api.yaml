apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  labels: { app.kubernetes.io/name: control-api, app.kubernetes.io/part-of: agentmesh }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: control-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-api, app.kubernetes.io/part-of: agentmesh }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: control-api } }
      containers:
        - name: control-api
          image: agentmesh/backend
          command: ["control-api"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: agentmesh-config }
            - secretRef: { name: agentmesh-db }
            - secretRef: { name: agentmesh-api-keys }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
spec:
  selector: { app.kubernetes.io/name: control-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: control-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: control-api }
