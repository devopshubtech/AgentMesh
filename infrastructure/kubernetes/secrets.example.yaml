# NOT applied by kustomize. Shape of the secrets the base expects; create them
# from your secret manager (External Secrets Operator, Vault, sealed-secrets).
# The command SIGNING key lives only in agentmesh-api-keys: gateways get the
# public half, so a compromised gateway cannot forge commands.
apiVersion: v1
kind: Secret
metadata: { name: agentmesh-db, namespace: agentmesh }
stringData:
  AGENTMESH_DATABASE_URL: postgres://agentmesh:CHANGE_ME@postgres-rw.db:5432/agentmesh?sslmode=verify-full
---
apiVersion: v1
kind: Secret
metadata: { name: agentmesh-api-keys, namespace: agentmesh }
stringData:
  AGENTMESH_USER_TOKEN_KEY: "<amctl keygen>"
  AGENTMESH_COMMAND_SIGNING_KEY: "<amctl keygen>"
---
apiVersion: v1
kind: Secret
metadata: { name: agentmesh-gateway-keys, namespace: agentmesh }
stringData:
  AGENTMESH_DEVICE_TOKEN_KEY: "<amctl keygen>"
  AGENTMESH_COMMAND_PUBLIC_KEY: "<amctl keygen>"
