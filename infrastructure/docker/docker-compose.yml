# AgentMesh local development stack.
#
# Host ports are deliberately NOT the defaults (80, 3000, 5432, 6000 are used
# by other projects on the dev machine) and are configurable in .env.
#
#   postgres       ${AM_PG_PORT:-15432}          -> 5432
#   nats           ${AM_NATS_PORT:-14222}        -> 4222   (monitor ${AM_NATS_MON_PORT:-18222} -> 8222)
#   control-api    ${AM_API_PORT:-18080}         -> 8080
#   agent-gateway  ${AM_GATEWAY_PORT:-18443}     -> 8443   (TLS, dev CA in ./certs)
#   dashboard      ${AM_DASHBOARD_PORT:-13000}   -> 80    (localhost)
#                  ${AM_DASHBOARD_TLS_PORT:-13443} -> 443 (HTTPS on the LAN: Android app)
#
# First run:  scripts/dev-setup.ps1 (or .sh)  — generates .env, keys and certs.
name: agentmesh

x-backend-env: &backend-env
  AGENTMESH_ENV: dev
  AGENTMESH_LOG_LEVEL: ${AM_LOG_LEVEL:-info}
  # AM_DATABASE_URL points the backend at an external Postgres (e.g. Neon via
  # Vercel; use its direct/unpooled URL). Unset = the bundled postgres service.
  AGENTMESH_DATABASE_URL: ${AM_DATABASE_URL:-postgres://agentmesh:${AM_PG_PASSWORD}@postgres:5432/agentmesh?sslmode=disable}
  AGENTMESH_NATS_URL: nats://nats:4222
  AGENTMESH_PUBLIC_GATEWAY_URL: ${AM_PUBLIC_GATEWAY_URL:-https://localhost:18443}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: ${AM_PG_PASSWORD:?run scripts/dev-setup first}
    ports:
      - "127.0.0.1:${AM_PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-m", "8222"]
    ports:
      - "127.0.0.1:${AM_NATS_PORT:-14222}:4222"
      - "127.0.0.1:${AM_NATS_MON_PORT:-18222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: agentmesh/backend:dev
    command: ["control-api"]
    restart: unless-stopped
    env_file: [.env.keys]
    environment:
      <<: *backend-env
      AGENTMESH_AUTO_MIGRATE: "true"
      # Stable URL that always returns the current public address (kept up to
      # date by scripts/start-agentmesh.ps1), embedded in phone connect links.
      AGENTMESH_RENDEZVOUS_URL: ${AM_RENDEZVOUS_URL:-}
      AGENTMESH_BOOTSTRAP_ADMIN_EMAIL: ${AM_ADMIN_EMAIL}
      AGENTMESH_BOOTSTRAP_ADMIN_PASSWORD: ${AM_ADMIN_PASSWORD}
      # The dashboard reaches the API through nginx on http://localhost.
      AGENTMESH_COOKIE_SECURE: "false"
      AGENTMESH_TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:${AM_API_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "amctl", "health", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 30

  agent-gateway:
    image: agentmesh/backend:dev
    command: ["agent-gateway"]
    restart: unless-stopped
    env_file: [.env.keys]
    environment:
      <<: *backend-env
      AGENTMESH_GATEWAY_TLS_CERT: /certs/gateway.pem
      AGENTMESH_GATEWAY_TLS_KEY: /certs/gateway-key.pem
      AGENTMESH_GATEWAY_ID: gw-1
    volumes:
      - ./certs:/certs:ro
    ports:
      # Bound on all interfaces so agents on other machines / VMs can reach it.
      - "${AM_GATEWAY_PORT:-18443}:8443"
    depends_on:
      control-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "amctl", "health", "https://127.0.0.1:8443/readyz"]
      interval: 5s
      timeout: 4s
      retries: 30

  worker:
    image: agentmesh/backend:dev
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      control-api: { condition: service_healthy }

  dashboard:
    build:
      context: ../../dashboard
    image: agentmesh/dashboard:dev
    restart: unless-stopped
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:${AM_DASHBOARD_PORT:-13000}:80"
      # HTTPS for LAN clients (Android control app); all interfaces.
      - "${AM_DASHBOARD_TLS_PORT:-13443}:443"
    depends_on:
      control-api: { condition: service_healthy }

  # Public HTTPS URL for phones/agents outside the LAN (mobile data), via a
  # Cloudflare quick tunnel: outbound only, no router changes, trusted cert.
  #   docker compose --profile public up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare.com   -> the public URL
  # The URL changes every time the tunnel restarts; use a named tunnel with
  # your own domain (or a public server) for a permanent address.
  tunnel:
    profiles: [public]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    # HTTP/2 transport measured ~60% faster than QUIC for the relay WebSocket.
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "https://dashboard:443", "--no-tls-verify"]
    depends_on:
      dashboard: { condition: service_healthy }

  # Permanent public URL on your own domain via a named Cloudflare tunnel.
  # In Cloudflare Zero Trust → Networks → Tunnels, create a tunnel, add a public
  # hostname (e.g. api.example.com) with service https://dashboard:443 and
  # "No TLS Verify" on, then put its token in .env as AM_TUNNEL_TOKEN.
  #   docker compose --profile named up -d tunnel-named
  tunnel-named:
    profiles: [named]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${AM_TUNNEL_TOKEN:-}
    depends_on:
      dashboard: { condition: service_healthy }

  # Exit node running on this host (Linux agent in a container). Traffic
  # leaves with the host's public IP; useful where the native agent cannot
  # run (e.g. Windows Application Control blocks unsigned binaries).
  #   AM_EXIT_ENROLL_TOKEN=am_enr_... docker compose --profile exit up -d exit-agent
  exit-agent:
    profiles: [exit]
    build:
      context: ../..
      dockerfile: infrastructure/docker/agent-linux.Dockerfile
    image: agentmesh/agent-linux:dev
    hostname: ${AM_EXIT_HOSTNAME:-home-exit-node}
    restart: unless-stopped
    environment:
      AGENTMESH_SERVER: https://agent-gateway:8443
      AGENTMESH_CA_FILE: /certs/ca.pem
      AGENTMESH_ENROLL_TOKEN: ${AM_EXIT_ENROLL_TOKEN:-}
      AGENTMESH_ENABLE_EXIT_NODE: "1"
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - exit-agent-state:/var/lib/agentmesh
    depends_on:
      agent-gateway: { condition: service_healthy }

  # A containerized Linux device for demos/tests:
  #   AM_DEMO_ENROLL_TOKEN=am_enr_... docker compose --profile demo up -d demo-agent
  demo-agent:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: infrastructure/docker/agent-linux.Dockerfile
    image: agentmesh/agent-linux:dev
    hostname: demo-linux-01
    restart: unless-stopped
    environment:
      AGENTMESH_SERVER: https://agent-gateway:8443
      AGENTMESH_CA_FILE: /certs/ca.pem
      AGENTMESH_ENROLL_TOKEN: ${AM_DEMO_ENROLL_TOKEN:-}
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - demo-agent-state:/var/lib/agentmesh
    depends_on:
      agent-gateway: { condition: service_healthy }

volumes:
  pgdata:
  demo-agent-state:
  exit-agent-state:
