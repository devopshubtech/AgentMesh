# HTTPS listener for LAN clients (Android control app, other machines).
# Mounted into the dashboard container by docker-compose only; uses the dev
# gateway certificate (SANs include the host's LAN IP — see dev-setup).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /certs/gateway.pem;
    ssl_certificate_key /certs/gateway-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $control_api http://control-api:8080;
    set $gateway https://agent-gateway:8443;

    # Relay (exit-node WebSockets) and agent endpoints are served on this same
    # origin, so one public URL (e.g. a Cloudflare Tunnel) is enough for
    # phones and agents outside the LAN. TLS to the gateway is verified
    # against the dev CA.
    location = /v1/relay {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host agent-gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name agent-gateway;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    location /v1/agent/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host agent-gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name agent-gateway;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.pem;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Public CA certificate for trust-on-first-use (the app shows its
    # SHA-256 fingerprint so the user can compare before trusting it).
    location = /agentmesh-ca.pem {
        alias /certs/ca.pem;
        default_type application/x-pem-file;
    }

    location = /v1/events {
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /v1/ {
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
