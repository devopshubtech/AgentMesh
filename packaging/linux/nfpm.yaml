# .deb / .rpm packaging for the Linux agent (built by scripts/build-release.sh).
# ${ARCH} and ${VERSION} are expanded by nfpm; the build script stages the
# binary at dist/stage/pkgbin/agentmesh-agent before each package run.
name: agentmesh-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: AgentMesh <noreply@agentmesh.local>
description: |
  AgentMesh device agent. Connects this machine outbound to an AgentMesh
  control plane for inventory, signed remote commands and (opt-in) exit-node
  sessions. Enroll after installing:
    sudo agentmesh-agent install --server https://<gateway> --token <am_enr_...>
homepage: https://github.com/devopshubtech/AgentMesh
license: Proprietary

contents:
  - src: dist/stage/pkgbin/agentmesh-agent
    dst: /usr/bin/agentmesh-agent
    file_info: { mode: 0755 }
  - src: packaging/linux/agentmesh-agent.service
    dst: /lib/systemd/system/agentmesh-agent.service
    type: config
  - dst: /var/lib/agentmesh
    type: dir
    file_info: { mode: 0700 }

scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
