# AgentMesh dashboard — served by nginx inside the container on port 80.
# Installed as /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Docker's embedded DNS; resolving at request time lets nginx start before control-api.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $control_api http://control-api:8080;

    # ---- Security headers (inherited by every location below: no location uses add_header) ----
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Live events (SSE): no buffering, long-lived ----
    location = /v1/events {
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- REST API ----
    location /v1/ {
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # ---- Hashed build assets: cache for a long time ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---- SPA with history-API fallback; never cache index.html ----
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
